substitutions:
  _PROJECT_ID: "healthcare-496102"
  _COMPOSER_ENV: "healthcare-airflow"
  _COMPOSER_REGION: "asia-southeast1"
  _COMPOSER_BUCKET: "asia-southeast1-healthcare--325dbf4b-bucket"
  # Tên image lưu trên Artifact Registry
  _CI_IMAGE: "asia-southeast1-docker.pkg.dev/${_PROJECT_ID}/healthcare-repo/de-tester:latest"

steps:
  # STEP 1: Validate & Unit Test (Sử dụng Custom Image)
  # Bước này sẽ cực nhanh vì KHÔNG CẦN pip install nữa
  - name: "${_CI_IMAGE}"
    id: "validate-and-test"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "========== Step 1: Fast Validation & Test =========="
        chmod +x scripts/validate_dag.sh
        ./scripts/validate_dag.sh
        
        echo "--- Running pytest ---"
        python -m pytest tests/test_dag_import.py -v --tb=short

  # STEP 2: Deploy to GCS & Composer
  - name: "gcr.io/cloud-builders/gsutil"
    id: "deploy-dags"
    entrypoint: "bash"
    env:
      - 'COMPOSER_BUCKET=${_COMPOSER_BUCKET}'
    args:
      - "-c"
      - |
        echo "========== Step 2: Deploying to ${_COMPOSER_BUCKET} =========="
        chmod +x scripts/deploy_dag.sh
        ./scripts/deploy_dag.sh

  # STEP 3: Trigger Airflow DAG
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "trigger-dag"
    entrypoint: "bash"
    env:
      - 'PROJECT_ID=${_PROJECT_ID}'
      - 'COMPOSER_ENV=${_COMPOSER_ENV}'
      - 'COMPOSER_REGION=${_COMPOSER_REGION}'
      - 'DAG_ID=parent_dag'
    args:
      - "-c"
      - |
        echo "========== Step 3: Triggering DAG ${DAG_ID} =========="
        chmod +x scripts/trigger_dag.sh
        ./scripts/trigger_dag.sh

options:
  logging: CLOUD_LOGGING_ONLY
  # Tăng tốc độ bằng cách sử dụng máy build cấu hình cao hơn (tùy chọn)
  machineType: 'E2_HIGHCPU_8'

timeout: "1200s"